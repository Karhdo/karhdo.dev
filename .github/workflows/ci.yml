name: CI

on:
  push:
    branches: [v2, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Astro needs Node >= 22.23.4; match Vercel Functions (Node 24).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bunx biome ci .

      - name: Palette lint
        run: bun run lint:palette

      - name: Astro check
        run: bunx astro check

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build
